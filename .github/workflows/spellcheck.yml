name: Reusable Spell Check

on:
  workflow_call:
    inputs:
      config:
        description: "Path to cspell configuration file"
        required: false
        type: string
        default: ".cspell.json"
      files:
        description: "Glob pattern for files to check"
        required: false
        type: string
        default: "**/*.md"
      runs-on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  spelling:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          config: ${{ inputs.config }}
          files: ${{ inputs.files }}
